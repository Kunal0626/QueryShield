# QueryShield proxy configuration.
# Read at startup by com.queryshield.proxy.ProxyServer. Override the path with:
#   make proxy ARGS=--config=path/to/file.properties

# Where the proxy listens (loopback only).
listen.host=127.0.0.1
listen.port=8080

# Where clean requests are forwarded (the app being protected).
upstream.base=http://127.0.0.1:8081

# block   = reject suspicious requests with 403
# monitor = log the decision but forward anyway (shadow mode)
mode=block

# Block when a field's detector score reaches this threshold (v3 scoring).
threshold=3

# Request parts beyond path/query/body that are inspected (case-insensitive).
inspect.headers=cookie,user-agent,referer

# Path prefixes exempt from inspection (comma-separated).
allow.paths=/health

# Requests with a body larger than this (bytes) are rejected with 413.
max.body.bytes=1048576

# Server thread-pool size.
threads=16
